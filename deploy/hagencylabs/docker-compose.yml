# hagencylabs.xyz stack, one environment per host (alpha = production, beta = staging).
# Driven by deploy.sh, which exports SERVER_IMAGE, CADDY_IMAGE and RELEASE_DIR
# (the rendered config snapshot for that image tag) before calling compose.
#   postgres : databases hagency, palpo, pasion (named volume pgdata, internal network only)
#   server   : hagency-server = Palpo homeserver + agent service + Pasion, one process
#   element  : Element Web for browser users (app.)
#   caddy    : automatic HTTPS, .well-known delegation, routing; the only published ports
#   livekit-jwt (profile calls): Element Call token service for LiveKit Cloud
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: hagency
      POSTGRES_DB: hagency
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-60}", "-c", "statement_timeout=60s",
              "-c", "idle_in_transaction_session_timeout=60s"]
    secrets: [postgres_password]
    cpus: ${PG_CPUS:-1.0}
    mem_limit: ${PG_MEM:-1g}
    pids_limit: 256
    volumes:
      - pgdata:/var/lib/postgresql
      - ../databases.sql:/docker-entrypoint-initdb.d/20-components.sql:ro
    networks: [db]
    healthcheck:
      # TCP, not the socket: the image's init-time server listens on the socket
      # only, so this passes only after initdb scripts (databases.sql) finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hagency -d hagency"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    <<: *hardening
    image: ${SERVER_IMAGE:?deploy.sh sets SERVER_IMAGE}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      RUST_LOG: ${SERVER_RUST_LOG:-warn}
      HAGENCY_NOTICE_LANGUAGE: en
    volumes:
      - ${RELEASE_DIR:?deploy.sh sets RELEASE_DIR}/config:/app/config:ro
      - server-data:/app/data
    networks: [db, edge]
    cap_drop: [ALL]
    # Entrypoint copies the config as root, then drops to uid 10001 (gosu).
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    stop_grace_period: 40s
    cpus: ${SERVER_CPUS:-2.0}
    mem_limit: ${SERVER_MEM:-2g}
    pids_limit: 1024

  element:
    <<: *hardening
    image: vectorim/element-web:v1.12.33@sha256:b0aa4b5a4fc1afaaff62e2dbd0c92d57e2b20724f3ccb2fef53aae949088c3d2
    volumes:
      - ${RELEASE_DIR}/element-config.json:/app/config.json:ro
    networks: [edge]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128

  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE:?deploy.sh sets CADDY_IMAGE}
    depends_on: [server, element]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${RELEASE_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Containers that dial the public names (the server calling its own
        # public_origin or .well-known) reach Caddy directly, no hairpin via the IGW.
        aliases: ["${DOMAIN:?}", "${SERVER_NAME:?}"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256

  livekit-jwt:
    <<: *hardening
    image: ghcr.io/element-hq/lk-jwt-service:0.3.0@sha256:52357326970d3f3e3cf6e9c33766e49cf2665e2cd57842e29a5c298514bd2e58
    profiles: [calls]
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_KEY: ${LIVEKIT_KEY:-}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${SERVER_NAME}
    env_file: ["${RELEASE_DIR}/secrets/livekit.env"]
    networks: [edge]
    cap_drop: [ALL]
    cpus: 0.25
    mem_limit: 128m

secrets:
  postgres_password: { file: "${RELEASE_DIR}/secrets/postgres_password" }

networks:
  db: { internal: true }
  edge: {}

# Named volumes are prefixed by the compose project (hagencylabs-<env>_pgdata ...).
# pgdata and server-data are the state backup.sh saves; caddy-data holds ACME
# account and certificates (re-issued automatically if lost).
volumes:
  pgdata:
  server-data:
  caddy-data:
  caddy-config:
