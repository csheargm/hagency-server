# Hagency public server. Driven by deploy.sh (renders runtime/ from .env first).
# Services: postgres, server (hagency-server = Palpo + Pasion embedded), element,
# caddy (HTTPS + .well-known + routing), concierge (hosted agents), calls (optional).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: hagency
      POSTGRES_DB: hagency
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-60}", "-c", "statement_timeout=${PG_STATEMENT_TIMEOUT:-60s}", "-c", "idle_in_transaction_session_timeout=60s"]
    secrets: [postgres_password]
    cpus: ${PG_CPUS:-1.0}
    mem_limit: ${PG_MEM:-1g}
    pids_limit: 256
    volumes:
      - pgdata:/var/lib/postgresql
      - ./templates/databases.sql:/docker-entrypoint-initdb.d/20-components.sql:ro
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hagency -d hagency"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    <<: *hardening
    image: ${SERVER_IMAGE}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./runtime/config:/app/config:ro
      - server-data:/app/data
      - ./runtime/ca:/run/extra-ca:ro
    environment:
      # Only set for TLS_MODE=internal (local tests); default is the system store.
      SSL_CERT_FILE: ${EXTRA_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
    networks: [db, edge]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    stop_grace_period: 40s
    cpus: ${SERVER_CPUS:-2.0}
    mem_limit: ${SERVER_MEM:-2g}
    pids_limit: 1024

  element:
    <<: *hardening
    image: vectorim/element-web:v1.12.33@sha256:b0aa4b5a4fc1afaaff62e2dbd0c92d57e2b20724f3ccb2fef53aae949088c3d2
    volumes:
      - ./runtime/element-config.json:/app/config.json:ro
    networks: [edge]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128

  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE}
    depends_on: [server, element]
    # Same port inside and out, so the public URL also works on the internal network.
    ports:
      - "${BIND_ADDR}:${HTTP_PORT}:${HTTP_PORT}"
      - "${BIND_ADDR}:${HTTPS_PORT}:${HTTPS_PORT}"
      - "${BIND_ADDR}:${HTTPS_PORT}:${HTTPS_PORT}/udp"
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # The concierge reaches the server by its public name through Caddy (the
        # client only admits a server whose metadata matches the URL it dialed).
        aliases: ["${DOMAIN}"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256

  concierge:
    <<: *hardening
    image: ${CONCIERGE_IMAGE}
    profiles: [concierge]
    depends_on: [caddy]
    environment:
      HAGENCY_SERVER_URL: ${PUBLIC_URL}
      HAGENCY_SERVER_NAME: ${SERVER_NAME}
      HAGENCY_NOTICE_LANGUAGE: en
      CONCIERGE_USER: ${CONCIERGE_USER}
      CONCIERGE_DAILY_TOKENS: ${CONCIERGE_DAILY_TOKENS}
      CONCIERGE_MAX_AGENTS_PER_USER: ${CONCIERGE_MAX_AGENTS_PER_USER}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    secrets: [concierge_password]
    volumes:
      - concierge-home:/home/agent
      - ./runtime/ca:/run/extra-ca:ro
    networks: [edge]
    # Host-run Ollama (OLLAMA_URL=http://host.docker.internal:11434) needs this on Linux.
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    cpus: ${CONCIERGE_CPUS:-2.0}
    mem_limit: ${CONCIERGE_MEM:-2g}
    pids_limit: 512

  livekit-jwt:
    <<: *hardening
    image: ghcr.io/element-hq/lk-jwt-service:0.3.0@sha256:52357326970d3f3e3cf6e9c33766e49cf2665e2cd57842e29a5c298514bd2e58
    profiles: [calls]
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_KEY: ${LIVEKIT_KEY:-}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET:-}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${SERVER_NAME}
    networks: [edge]
    cap_drop: [ALL]
    cpus: 0.25
    mem_limit: 128m

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  concierge_password: { file: ./secrets/concierge_password }

networks:
  db: { internal: true }
  edge: {}

volumes:
  pgdata:
  server-data:
  caddy-data:
  caddy-config:
  concierge-home:
